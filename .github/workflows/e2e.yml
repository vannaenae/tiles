name: End-to-end test

# Runs the real app on a GitHub macOS machine: opens windows, switches layouts,
# records window positions and screenshots, and pushes them to the e2e-screenshots branch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  e2e:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Unit tests with Xcode (xcodebuild)
        run: |
          xcodebuild -version
          xcodebuild -list
          xcodebuild test -scheme Tiles-Package -destination 'platform=macOS' -quiet

      - name: Build and install
        run: |
          swiftc -O scripts/e2e.swift -o "$RUNNER_TEMP/tiles-e2e"
          ./scripts/build-app.sh
          cp -R dist/Tiles.app /Applications/
          defaults write io.github.vannaenae.tiles didShowSettings -bool true

      - name: Pre-approve Accessibility and screen capture (test machine only)
        run: |
          db="/Library/Application Support/com.apple.TCC/TCC.db"
          now=$(date +%s)
          grant() { # service client client_type
            sudo sqlite3 "$db" "INSERT OR REPLACE INTO access (service,client,client_type,auth_value,auth_reason,auth_version,csreq,policy_id,indirect_object_identifier_type,indirect_object_identifier,indirect_object_code_identity,flags,last_modified,pid,pid_version,boot_uuid,last_reminded) VALUES ('$1','$2',$3,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,$now,NULL,NULL,'UNUSED',0);" \
              && echo "granted $1 to $2" || echo "could not grant $1 to $2"
          }
          grant kTCCServiceAccessibility io.github.vannaenae.tiles 0
          grant kTCCServiceAccessibility /Applications/Tiles.app/Contents/MacOS/Tiles 1
          for c in /usr/sbin/screencapture /bin/bash /bin/zsh; do grant kTCCServiceScreenCapture "$c" 1; done
          # The test driver posts real key presses and mouse drags.
          grant kTCCServiceAccessibility "$RUNNER_TEMP/tiles-e2e" 1
          grant kTCCServicePostEvent "$RUNNER_TEMP/tiles-e2e" 1
          grant kTCCServiceScreenCapture "$RUNNER_TEMP/tiles-e2e" 1
          sudo sqlite3 "$db" "SELECT service, client, auth_value FROM access WHERE client LIKE '%iles%' OR service='kTCCServiceScreenCapture';"

      - name: Run scenario
        run: |
          mkdir -p out
          shot() { sleep 2; screencapture -x "out/$1.png" || echo "screencapture failed for $1"; echo "== $1" >> out/windows.txt; swift scripts/windows.swift >> out/windows.txt; }
          for i in 1 2 3; do printf 'Document %s\n' "$i" > "$RUNNER_TEMP/doc$i.txt"; done
          open -a TextEdit "$RUNNER_TEMP/doc1.txt" "$RUNNER_TEMP/doc2.txt" "$RUNNER_TEMP/doc3.txt"
          open /Applications
          sleep 4
          shot 0-before-tiles

          open /Applications/Tiles.app
          sleep 6
          shot 1-dwindle
          for layout in columns centered-master grid scrolling; do open -g "tiles://layout-$layout"; shot "2-$layout"; done
          open -g "tiles://cycle-width"; shot 3-scrolling-wider
          open -g "tiles://focus-right"; shot 4-scrolling-focus-right
          open -g "tiles://layout-dwindle"; sleep 1

      - name: Real keyboard and mouse checks
        run: "$RUNNER_TEMP/tiles-e2e"

      - name: Dashboard screenshots
        if: ${{ always() }}
        run: |
          shot() { sleep 2; screencapture -x "out/$1.png" || echo "screencapture failed for $1"; echo "== $1" >> out/windows.txt; swift scripts/windows.swift >> out/windows.txt; }
          open /Applications/Tiles.app   # opening again shows the dashboard
          sleep 4
          shot 5-dashboard-light
          python3 - <<'PY'
          import json, os
          p = os.path.expanduser("~/.config/tiles/config.json")
          c = json.load(open(p)); c["appearance"] = "dark"; c["theme"] = "purple"
          json.dump(c, open(p, "w"))
          PY
          sleep 3
          shot 6-dashboard-dark-purple
          # Same dashboard in French, to check the translations load.
          osascript -e 'quit app "Tiles"' || true
          sleep 2
          defaults write io.github.vannaenae.tiles AppleLanguages -array fr
          open /Applications/Tiles.app; sleep 3; open /Applications/Tiles.app; sleep 4
          shot 7-dashboard-french
          defaults delete io.github.vannaenae.tiles AppleLanguages
          cat out/windows.txt
          pgrep -x Tiles >/dev/null && echo "Tiles still running" || echo "Tiles is NOT running"

      - name: Publish screenshots to the e2e-screenshots branch
        if: ${{ always() }}
        run: |
          cd out
          git init -q -b e2e-screenshots
          git -c user.name=tiles-e2e -c user.email=e2e@users.noreply.github.com add -A
          git -c user.name=tiles-e2e -c user.email=e2e@users.noreply.github.com commit -qm "E2E screenshots for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" e2e-screenshots
